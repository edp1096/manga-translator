<!doctype html><html lang="ko"><meta charset="utf-8"><title>만화 번역 편집</title><link rel="stylesheet" href="ui.css"><style>header{position:sticky;top:0;padding:10px 20px;background:#fff;z-index:3;border-bottom:1px solid #ccd}#layout{display:grid;grid-template-columns:minmax(350px,1fr) 330px;gap:20px;padding:20px}#stage{position:relative;align-self:start}canvas{display:block;width:100%;height:auto}#handles{position:absolute;inset:0;pointer-events:none}.box{position:absolute;border:1px dashed #258e99;pointer-events:auto;cursor:move}.box.selected{border:2px solid #e97922;background:#f808}.resize{position:absolute;right:-4px;bottom:-4px;width:12px;height:12px;background:#e97922;cursor:se-resize}aside{background:white;padding:20px;border-radius:10px;align-self:start;position:sticky;top:85px;max-height:calc(100vh - 110px);overflow:auto}h1{display:inline;font-size:18px;margin-right:20px}#regions{width:100%}#status{padding-left:10px}</style><header><h1>번역 편집</h1><button id="apply">페이지에 적용</button><button id="png">PNG 저장</button><button id="project">편집 JSON 저장</button><button id="toggle">원본 보기</button><span id="status">불러오는 중…</span></header><div id="layout"><div id="stage"><canvas id="canvas"></canvas><div id="handles"></div></div><aside><label>영역<select id="regions"></select></label><button id="add">글상자 추가</button><button id="delete">선택 글상자 삭제</button><label>원문<textarea id="source"></textarea></label><label>번역문<textarea id="translation"></textarea></label><label>표시 방식<select id="mode"><option value="replace">말풍선에 표시</option><option value="tooltip">원본 보존 · 툴팁</option><option value="original">원본만 표시</option></select></label><label>최대 글자 크기<input id="font" type="number" min="8" max="100"></label><button id="reset">영역 위치 초기화</button><p>상자를 드래그해 위치를 옮기고 오른쪽 아래 모서리로 크기를 바꿉니다. 글자 크기는 상자에 맞춰 자동 축소됩니다.</p><small>원문 수정은 기록용입니다. 번역문은 직접 수정하세요. 단색 바탕은 원래 배경색으로 복원합니다. 복잡한 그림과 효과음은 원본을 보존하며 툴팁으로 확인합니다.</small></aside></div><script src="render.js"></script><script src="editor.js"></script></html>
