<!doctype html><html lang="ko"><meta charset="utf-8"><title>만화 번역 설정</title><link rel="stylesheet" href="ui.css"><main><h1>만화 번역 설정</h1><p>이 컴퓨터의 크롬에서 이미지를 읽고, 지정한 서버에서 OCR·번역합니다.</p><form id="settings"><label>처리 서버 주소<input id="server" type="url" required></label><p>로컬 앱은 관리 화면의 <strong>크롬 확장 → 확장 연결하기</strong>를 누르면 연결됩니다. 토큰을 직접 입력할 필요가 없습니다.</p><details><summary>외부 서버 고급 설정</summary><label>외부 서버 접근 토큰<input id="token" type="password" autocomplete="off"></label></details><label>번역 언어<select id="target"><option value="Korean">한국어</option><option value="English">English</option><option value="Japanese">日本語</option><option value="Chinese">中文</option></select></label><label>이미지 CSS 선택자 (비우면 자동 탐지)<input id="selector" placeholder="예: .chapter-content img"></label><label><input id="captureFallback" type="checkbox">원본 파일 접근 실패 시 현재 탭 화면 캡처 허용</label><p>화면 캡처는 탭이 활성 상태일 때만 작동하며 화면 해상도로 처리합니다. 긴 세로 이미지는 분할 후 사용하세요.</p><button>저장</button><output id="status"></output></form></main><script src="options.js"></script></html>
