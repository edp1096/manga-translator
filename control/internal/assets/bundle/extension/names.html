<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>작품별 명칭 사전</title><link rel="stylesheet" href="ui.css"><style>
main{max-width:1120px;margin:24px auto;padding:24px}h1{margin:0}p{margin:8px 0}.row,.actions,.toolbar,.pagination{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row>label{flex:1;min-width:160px}label{margin:8px 0}button{margin:0;padding:6px 12px}input:not([type=checkbox]),select,textarea{padding:6px 8px}.note{color:#586674;font-size:13px}.toolbar{position:sticky;top:0;background:white;padding:12px 0;z-index:2}.toolbar input{flex:1;min-width:150px}.toolbar select{width:auto}#entries{border:1px solid #d4dde4;border-radius:8px;overflow:hidden}.entry{border-bottom:1px solid #e1e6eb}.entry:last-child{border-bottom:0}.entry-line{display:grid;grid-template-columns:34px 90px minmax(110px,1fr) 22px minmax(110px,1fr);gap:8px;align-items:center;padding:6px 10px}.entry-line input,.entry-line select{min-width:0;font-size:14px}.expand{background:#edf2f5;color:#243744;padding:5px}.arrow{color:#71818d;text-align:center}.entry-details{padding:8px 18px 16px 52px;background:#f6f8fa;border-top:1px solid #e1e6eb}.entry-details textarea{min-height:65px}.check{display:flex;align-items:center;gap:6px}.entry-status:empty{display:none}.danger{background:white;color:#9c3030;border:1px solid #c69595}.savebar{position:sticky;bottom:0;padding:12px 0;background:white;border-top:1px solid #d4dde4;margin-top:12px}.pagination{justify-content:flex-end;margin:10px 0}#status{white-space:pre-wrap;min-height:1.6em}#scope-list{word-break:break-all}.reading-preview{max-width:100%}details{margin:8px 0}summary{cursor:pointer}#empty{padding:16px;color:#586674}[hidden]{display:none!important}@media(max-width:650px){main{margin:0;padding:14px;border-radius:0}.entry-line{gap:4px;padding:6px;grid-template-columns:28px 70px minmax(65px,1fr) 14px minmax(65px,1fr)}.entry-details{padding:10px}.toolbar{position:static}}
</style><main>
<h1>작품별 명칭 사전</h1><p class="note">인물·장소·단체·용어·호칭을 작품과 번역 언어별로 통일합니다. 일본어·영어 등 원문의 표기를 입력하세요.</p>
<div class="row"><label>저장된 사전<select id="work"><option value="">새 사전</option></select></label><label>번역 언어<select id="target"><option value="Korean">한국어</option><option value="English">영어</option><option value="Chinese">중국어</option><option value="Japanese">일본어</option></select></label></div>
<label>작품 이름<input id="title" placeholder="작품 이름"></label>
<details><summary>작품 연결 · 가져오기 / 내보내기</summary><p id="current-page" class="note"></p><label class="check"><input id="bind" type="checkbox" checked>현재 만화 주소를 이 작품에 연결</label><div id="scope-list" class="note"></div><p class="note">다음 화가 자동으로 연결되지 않는 뷰어에서는 저장된 사전을 선택해 연결하세요. 언어를 바꾸면 해당 언어의 사전을 별도로 편집합니다.</p><div class="actions"><button id="export">내보내기</button><button id="import">가져오기</button><input id="import-file" type="file" accept="application/json,.json" hidden></div></details>
<div class="toolbar"><input id="search" type="search" aria-label="명칭 검색" placeholder="원문·번역·읽기·별칭 검색"><select id="filter" aria-label="종류 필터"><option value="">모든 종류</option></select><button id="add">명칭 추가</button></div>
<div id="entries" aria-label="명칭 목록"></div><p id="empty" hidden>검색 조건에 맞는 명칭이 없습니다.</p>
<div class="pagination"><span id="count" class="note"></span><button id="previous" aria-label="이전 목록">이전</button><span id="page-number"></span><button id="next" aria-label="다음 목록">다음</button></div>
<div class="savebar"><div class="actions"><button id="save">사전 저장</button><span class="note">새 번역에 자동 적용 · 기존 번역은 패널의 ‘명칭 통일’</span></div><div id="status" role="status"></div></div>
<details id="reading-tools" hidden><summary>원본과 후리가나 확인</summary><label>현재 페이지의 번역 영역<select id="reading-region"></select></label><div class="actions"><button id="reading-view">원본 확대 보기</button><button id="reading-run">후리가나 읽기 제안</button></div><p id="reading-status" class="note"></p><img id="reading-preview" class="reading-preview" alt="선택한 원문 영역"><pre id="reading-result"></pre></details>
<p><a href="options.html">일반 설정</a></p>
</main><script src="names.js"></script><script src="names_editor.js"></script></html>
