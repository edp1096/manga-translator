<!doctype html><html lang="ko"><meta charset="utf-8"><title>Manga Translator</title><link rel="stylesheet" href="ui.css"><style>html,body{height:100%;overflow:hidden}main{margin:0;padding:0;border-radius:0;height:100dvh;display:flex;flex-direction:column;min-height:0}#panel-header{flex:none;padding:8px 16px;background:white;border-bottom:1px solid #dde3e8}#list-scroll{flex:1;min-height:0;overflow-y:auto;padding:0 16px 16px}button{padding:7px 10px}#status{margin:12px 0;white-space:pre-wrap;font-size:13px}.item{border-bottom:1px solid #ddd;padding:8px 0;font-size:13px;display:flex;align-items:center;gap:6px}.item-choice{display:flex;align-items:center;gap:6px;flex:1;min-width:0;margin:0;cursor:pointer}.item span{flex:1;overflow-wrap:anywhere;white-space:pre-line}.item button{font-size:12px;padding:3px 7px}.item img{width:54px;height:76px;object-fit:contain}#page{font-size:12px;overflow-wrap:anywhere;color:#677}#selection-controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0}#all{display:flex;align-items:center;gap:5px;margin:0}#toggle{margin:0}.note{font-size:12px;color:#657}</style><main><header id="panel-header"><div id="page"></div><div id="status">페이지에 연결하는 중…</div><button id="preload" title="현재 이미지를 찾고 뒤쪽 이미지까지 추가로 불러옵니다">새로고침</button><button id="run">번역</button><button id="stop">중지</button><button id="settings">설정</button><div id="selection-controls"><label id="all"><input type="checkbox" checked>전체 선택</label><button id="zip" disabled>선택 저장</button><button id="toggle">원본/번역</button></div></header><div id="list-scroll"><div id="items"></div><p class="note">뒤쪽 이미지가 목록에 없으면 새로고침을 누르세요. 스크롤 또는 지원 뷰어의 페이지 넘김으로 본문을 불러옵니다. 새로고침이나 번역이 끝난 뒤 시작 위치로 되돌리지 않습니다. 토나리노 영점프처럼 화면 읽기가 필요한 뷰어에서는 이 만화 탭을 활성 상태로 유지하세요. 사이트에는 번역 이미지만 표시합니다. 모든 버튼은 크롬 확장 안에서 작동합니다. 흰색·검정 단색 나레이션은 직접 번역하고, 복잡한 그림은 원본을 보존합니다. 이동 버튼으로 해당 이미지를 강조할 수 있습니다.</p></div></main><script src="zip.js"></script><script src="panel.js"></script></html>
