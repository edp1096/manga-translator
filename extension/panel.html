<!doctype html><html lang="ko"><meta charset="utf-8"><title>Manga Translator</title><link rel="stylesheet" href="ui.css"><style>html,body{height:100%;overflow:hidden}main{margin:0;padding:0;border-radius:0;height:100dvh;display:flex;flex-direction:column;min-height:0}#panel-header{flex:none;max-height:calc(100% - 96px);overflow-y:auto;padding:8px 16px;background:white;border-bottom:1px solid #dde3e8}#list-scroll{flex:1;min-height:0;overflow-y:auto;padding:0 16px 16px}button{padding:7px 10px}#status{margin:12px 0;white-space:pre-wrap;font-size:13px}.item{border-bottom:1px solid #ddd;padding:8px 0;font-size:13px;display:flex;align-items:center;gap:6px}.item-choice{display:flex;align-items:center;gap:6px;flex:1;min-width:0;margin:0;cursor:pointer}.item span{flex:1;overflow-wrap:anywhere;white-space:pre-line}.item button{font-size:12px;padding:3px 7px}.item img{width:54px;height:76px;object-fit:contain}#page-row{display:flex;align-items:center;gap:8px}#page{flex:1;min-width:0;font-size:12px;overflow-wrap:anywhere;color:#677}#selection-controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0}#all{display:flex;align-items:center;gap:5px;margin:0}#toggle{margin:0}.note{font-size:12px;color:#657}#display-controls{margin:8px 0}#display-controls .display-row{display:flex;align-items:center;gap:6px}#display-controls label{display:flex;align-items:center;gap:8px;margin:0;font-size:13px}#display-mode{flex:1;min-width:0;padding:5px}#display-status{margin-top:4px;font-size:12px;color:#456;overflow-wrap:anywhere}#display-retry{margin-top:4px}#outside-text-mode{flex:1;min-width:0;padding:5px;font-size:13px}.outside-label{flex:none;font-size:13px}#name-controls .help-button{vertical-align:middle}.help-button{flex:none;width:22px;height:22px;padding:0;margin:0;border:1px solid #a9bec4;border-radius:50%;background:#f0f6f7;color:#125c69;font-size:13px;line-height:20px;font-weight:700}.help-button:hover,.help-button[aria-expanded=true]{background:#dceef1}.help-button:focus-visible{outline:2px solid #16849a;outline-offset:2px}[hidden]{display:none!important}#panel-help{position:fixed;inset:auto;margin:0;padding:12px;border:1px solid #b8cbd0;border-radius:10px;background:white;color:#19232f;box-shadow:0 6px 24px #0003;font:13px/1.6 system-ui,sans-serif;overflow:auto;overflow-wrap:anywhere}#panel-help .help-head{display:flex;align-items:center;gap:8px}#help-title{flex:1}#help-close{padding:0 6px;margin:0;background:transparent;color:#456;font-size:20px;line-height:24px}#help-body p{margin:8px 0 0}#help-current{margin:10px 0 0;padding-top:8px;border-top:1px solid #dde3e8;color:#456}</style><main><header id="panel-header"><div id="page-row"><div id="page"></div><button class="help-button" type="button" data-help="reader" aria-label="패널 사용 도움말" aria-expanded="false" aria-controls="panel-help">?</button></div><div id="status">페이지에 연결하는 중…</div><button id="preload" title="현재 이미지를 찾고 뒤쪽 이미지까지 추가로 불러옵니다">새로고침</button><button id="run">번역</button><button id="stop">중지</button><button id="settings">설정</button><div id="name-controls"><button id="names-settings">명칭 사전</button><button id="names-correct" title="현재 작품의 불러온 번역과 저장된 다른 화의 명칭을 통일합니다">명칭 통일</button><button id="names-undo">명칭 되돌림</button><button class="help-button" type="button" data-help="names" aria-label="명칭 사전 도움말" aria-expanded="false" aria-controls="panel-help">?</button><div id="name-status" class="note" role="status" hidden></div></div><div id="selection-controls"><label id="all"><input type="checkbox" checked>전체 선택</label><button id="zip" disabled>선택 저장</button><button id="toggle">원본/번역</button></div><div id="display-controls"><div class="display-row" style="margin-bottom:8px"><label><input id="lightweight-display" type="checkbox">경량 표시</label><button class="help-button" type="button" data-help="lightweight" aria-label="경량 표시 도움말" aria-expanded="false" aria-controls="panel-help">?</button></div><div class="display-row"><label for="display-mode">표시 방식</label><button class="help-button" type="button" data-help="display" aria-label="표시 방식 도움말" aria-expanded="false" aria-controls="panel-help">?</button><select id="display-mode"><option value="auto">기본 표시</option><option value="white">말풍선 흰 배경 자동</option></select></div><div class="display-row" style="margin-top:8px"><label class="outside-label" for="outside-text-mode">대사·독백</label><button class="help-button" type="button" data-help="outside" aria-label="대사·독백 도움말" aria-expanded="false" aria-controls="panel-help">?</button><select id="outside-text-mode" aria-label="대사·독백 표시"><option value="tooltip">툴팁</option><option value="white">흰 배경</option><option value="restore">이미지 복원</option></select></div><div id="display-status" role="status" hidden></div><button id="display-retry" hidden>다시 적용</button></div></header><div id="list-scroll"><div id="items"></div></div><section id="panel-help" popover="auto" role="dialog" aria-labelledby="help-title"><div class="help-head"><strong id="help-title"></strong><button id="help-close" type="button" aria-label="도움말 닫기">×</button></div><div id="help-body"></div><p id="help-current" hidden></p></section></main><script src="zip.js"></script><script src="panel.js"></script></html>
