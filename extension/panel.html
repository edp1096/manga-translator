<!DOCTYPE html>
<html lang="ko"><meta charset="utf-8"/><title>Manga Translator</title><link href="ui.css" rel="stylesheet"/><style>html,body{height:100%;overflow:hidden}main{margin:0;padding:0;border-radius:0;height:100dvh;display:flex;flex-direction:column;min-height:0}#panel-header{flex:none;max-height:calc(100% - 96px);overflow-y:auto;padding:8px 16px;background:white;border-bottom:1px solid #dde3e8}#list-scroll{flex:1;min-height:0;overflow-y:auto;padding:0 16px 16px}button{padding:7px 10px}#status{margin:12px 0;white-space:pre-wrap;font-size:13px}.item{border-bottom:1px solid #ddd;padding:8px 0;font-size:13px;display:flex;align-items:center;gap:6px}.item-choice{display:flex;align-items:center;gap:6px;flex:1;min-width:0;margin:0;cursor:pointer}.item span{flex:1;overflow-wrap:anywhere;white-space:pre-line}.item button{font-size:12px;padding:3px 7px}.item img{width:54px;height:76px;object-fit:contain}#page-row{display:flex;align-items:center;gap:8px}#page{flex:1;min-width:0;font-size:12px;overflow-wrap:anywhere;color:#677}#selection-controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0}#all{display:flex;align-items:center;gap:5px;margin:0}#toggle{margin:0}.note{font-size:12px;color:#657}#display-controls{margin:8px 0}#display-controls .display-row{display:flex;align-items:center;gap:6px}#display-controls label{display:flex;align-items:center;gap:8px;margin:0;font-size:13px}#display-mode{flex:1;min-width:0;padding:5px}#display-status{margin-top:4px;font-size:12px;color:#456;overflow-wrap:anywhere}#display-retry{margin-top:4px}#outside-text-mode{flex:1;min-width:0;padding:5px;font-size:13px}.outside-label{flex:none;font-size:13px}#name-controls .help-button{vertical-align:middle}.help-button{flex:none;width:22px;height:22px;padding:0;margin:0;border:1px solid #a9bec4;border-radius:50%;background:#f0f6f7;color:#125c69;font-size:13px;line-height:20px;font-weight:700}.help-button:hover,.help-button[aria-expanded=true]{background:#dceef1}.help-button:focus-visible{outline:2px solid #16849a;outline-offset:2px}[hidden]{display:none!important}#panel-help{position:fixed;inset:auto;margin:0;padding:12px;border:1px solid #b8cbd0;border-radius:10px;background:white;color:#19232f;box-shadow:0 6px 24px #0003;font:13px/1.6 system-ui,sans-serif;overflow:auto;overflow-wrap:anywhere}#panel-help .help-head{display:flex;align-items:center;gap:8px}#help-title{flex:1}#help-close{padding:0 6px;margin:0;background:transparent;color:#456;font-size:20px;line-height:24px}#help-body p{margin:8px 0 0}#help-current{white-space:pre-wrap;margin:10px 0 0;padding-top:8px;border-top:1px solid #dde3e8;color:#456}.save-buttons{display:flex;gap:4px;align-items:center}.save-buttons button{white-space:nowrap}#selection-controls{gap:6px;flex-wrap:wrap}#all,#toggle{flex:none;white-space:nowrap}#save-options{position:fixed;inset:auto;margin:0;padding:12px;border:1px solid #b8cbd0;border-radius:10px;background:white;color:#19232f;box-shadow:0 6px 24px #0003;font:13px/1.5 system-ui,sans-serif;overflow:auto}#save-options label{display:flex;align-items:center;gap:8px;margin:10px 0}#save-options select{flex:1;min-width:0;padding:5px;font-size:13px}#save-group-note{margin:8px 0 0;font-size:12px;color:#567}.item .pair-toggle{flex:none}.item.paired{border-left:3px solid #16849a;padding-left:5px}
#panel-header{padding:8px 12px;max-height:50%;overscroll-behavior:contain;scrollbar-gutter:stable}
#list-scroll{padding:0 12px 12px;overscroll-behavior:contain}
#page-row{min-height:22px}#page{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.primary-actions{display:flex;gap:5px;align-items:center;margin:6px 0}

.status-row{display:flex;align-items:center;gap:5px;min-width:0;margin:4px 0 6px}

#selection-controls{gap:5px;margin:6px 0}#selection-controls button{padding:5px 7px;font-size:12px}#all{font-size:12px;gap:4px}
#quick-display{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;margin:6px 0}
.quick-option{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
#quick-display label{display:inline-flex;align-items:center;gap:4px;margin:0;font-size:12px}
#quick-display .help-button{width:18px;height:18px;font-size:11px;line-height:16px}
.panel-section{margin:4px 0;border:1px solid #dce4e8;border-radius:6px}
.panel-section>summary{cursor:pointer;padding:4px 7px;font-size:12px;line-height:20px;color:#345;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel-section[open]>summary{border-bottom:1px solid #e5eaee;background:#f5f8f9}
.panel-section #display-controls,.panel-section #name-controls{margin:0;padding:8px}
#name-controls{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
#name-controls button:not(.help-button){padding:5px 7px;margin:0;font-size:12px;white-space:nowrap}
#name-status{flex-basis:100%;font-size:12px;margin-top:3px}
#display-status{line-height:1.4;max-height:3em;overflow:auto}
#display-retry{padding:4px 8px;font-size:12px;margin:4px 0}
</style><main><header id="panel-header"><div id="page-row"><div id="page"></div><button aria-controls="panel-help" aria-expanded="false" aria-label="패널 사용 도움말" class="help-button" data-help="reader" type="button">?</button></div><div aria-label="번역 작업" class="primary-actions" role="group"><button id="preload" title="현재 이미지를 찾고 뒤쪽 이미지까지 추가로 불러옵니다">새로고침</button><button id="run">번역</button><button id="stop">중지</button><button id="settings">설정</button></div><div class="status-row"><div aria-live="polite" id="status" role="status">페이지에 연결하는 중…</div><button aria-controls="panel-help" aria-expanded="false" aria-label="진행 상태 전체 보기" class="help-button" data-help="status" type="button">i</button></div><div id="selection-controls"><label id="all"><input checked="" type="checkbox"/>전체 선택</label><span class="save-buttons"><button disabled="" id="zip">선택 저장</button><button aria-label="저장 묶음 설정" id="save-options-toggle" popovertarget="save-options" title="저장 묶음 설정" type="button">묶음</button></span><button id="toggle">원본/번역</button></div><div class="display-row" id="quick-display"><span class="quick-option"><label><input id="lightweight-display" type="checkbox"/>경량 처리</label><button aria-controls="panel-help" aria-expanded="false" aria-label="경량 처리 도움말" class="help-button" data-help="lightweight" type="button">?</button></span><span class="quick-option"><label><input id="force-tooltip-restoration" type="checkbox"/>툴팁대사 표시</label><button aria-controls="panel-help" aria-expanded="false" aria-label="추가 복원 도움말" class="help-button" data-help="force" type="button">?</button></span></div><details class="panel-section" id="display-tools"><summary>표시 옵션</summary><div id="display-controls"><div class="display-row"><label for="display-mode">표시 방식</label><button aria-controls="panel-help" aria-expanded="false" aria-label="표시 방식 도움말" class="help-button" data-help="display" type="button">?</button><select id="display-mode"><option value="auto">기본 표시</option><option value="white">말풍선 흰 배경 자동</option></select></div><div class="display-row" style="margin-top:8px"><label class="outside-label" for="outside-text-mode">대사·독백</label><button aria-controls="panel-help" aria-expanded="false" aria-label="대사·독백 도움말" class="help-button" data-help="outside" type="button">?</button><select aria-label="대사·독백 표시" id="outside-text-mode"><option value="tooltip">툴팁</option><option value="white">흰 배경</option><option value="restore">이미지 복원</option></select></div></div></details><details class="panel-section" id="name-tools"><summary>명칭 도구</summary><div id="name-controls"><button id="names-settings">명칭 사전</button><button id="names-correct" title="현재 작품의 불러온 번역과 저장된 다른 화의 명칭을 통일합니다">명칭 통일</button><button id="names-undo">명칭 되돌림</button><button aria-controls="panel-help" aria-expanded="false" aria-label="명칭 사전 도움말" class="help-button" data-help="names" type="button">?</button><div class="note" hidden="" id="name-status" role="status"></div></div></details><div hidden="" id="display-status" role="status"></div><button hidden="" id="display-retry">다시 적용</button></header><div id="list-scroll"><div id="items"></div></div><section aria-labelledby="help-title" id="panel-help" popover="auto" role="dialog"><div class="help-head"><strong id="help-title"></strong><button aria-label="도움말 닫기" id="help-close" type="button">×</button></div><div id="help-body"></div><p hidden="" id="help-current"></p></section><section aria-labelledby="save-options-title" id="save-options" popover="auto"><strong id="save-options-title">저장 묶음</strong><label>방식<select id="save-group-mode"><option value="single">개별 저장</option><option value="pairs">2장씩 묶기</option><option value="manual">직접 묶기</option></select></label><label><input id="save-first-single" type="checkbox"/>첫 장은 따로 저장</label><label>페이지 순서<select id="save-direction"><option value="rtl">오른쪽 → 왼쪽</option><option value="ltr">왼쪽 → 오른쪽</option></select></label><p id="save-group-note">묶은 두 페이지는 가로로 이어 붙인 PNG 한 장으로 ZIP에 저장합니다.</p></section></main><script src="zip.js"></script><script src="panel.js"></script></html>
